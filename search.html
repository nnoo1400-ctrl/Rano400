<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>البحث عن اللجان والمقررات</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      padding: 30px 20px;
    }

    .search-section {
      margin-bottom: 30px;
    }

    .upload-section {
      background: #f0f4ff;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 2px dashed #667eea;
    }

    .upload-section h3 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 16px;
    }

    input[type="file"] {
      display: block;
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      width: 100%;
      cursor: pointer;
    }

    input[type="text"] {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      transition: all 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .search-info {
      color: #666;
      font-size: 13px;
      margin-top: 8px;
    }

    .table-wrapper {
      overflow-x: auto;
      margin-top: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-weight: bold;
    }

    th, td {
      padding: 15px;
      text-align: right;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      font-weight: 600;
      font-size: 14px;
    }

    tbody tr {
      transition: background 0.2s;
    }

    tbody tr:hover {
      background: #f9f9f9;
    }

    tbody tr:nth-child(even) {
      background: #fafafa;
    }

    .no-data {
      text-align: center;
      padding: 40px 20px;
      color: #999;
      font-size: 16px;
    }

    .status-message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }

    .status-message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .status-message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .status-message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      display: block;
    }

    .results-count {
      color: #667eea;
      font-weight: bold;
      margin-top: 15px;
      font-size: 14px;
    }

    .button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .button:active {
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 22px;
      }

      .content {
        padding: 20px 15px;
      }

      th, td {
        padding: 10px 5px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🔍 البحث عن اللجان والمقررات</h1>
    <p>المدرسة الثانوية الثالثة بالخبر</p>
  </div>

  <div class="content">
    <!-- رسالة الحالة -->
    <div id="statusMessage" class="status-message"></div>

    <!-- قسم الرفع -->
    <div class="upload-section">
      <h3>📁 رفع ملف Excel</h3>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
      <button class="button" onclick="document.getElementById('fileInput').click()">
        اختر ملف
      </button>
      <p style="font-size: 12px; color: #666; margin-top: 10px;">
        صيغ مدعومة: Excel (.xlsx, .xls) أو CSV
      </p>
    </div>

    <!-- قسم البحث -->
    <div class="search-section">
      <input 
        type="text" 
        id="search" 
        placeholder="ابحثي عن الاسم أو السجل المدني أو رقم اللجنة..."
        disabled
      />
      <div class="search-info">
        💡 اكتبي أي معلومة عن الطالبة للبحث الفوري
      </div>
    </div>

    <!-- الجدول -->
    <div class="table-wrapper">
      <table id="resultsTable">
        <thead>
          <tr id="headerRow"></tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="10" class="no-data">⏳ جاري انتظار رفع الملف...</td></tr>
        </tbody>
      </table>
      <div class="results-count" id="resultsCount"></div>
    </div>
  </div>
</div>

<script>
let allData = [];
let headers = [];

// معالجة رفع الملف
document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  showStatus('جاري معالجة الملف...', 'info');

  const reader = new FileReader();
  reader.onload = function(event) {
    try {
      const data = new Uint8Array(event.target.result);
      const workbook = XLSX.read(data, { type: 'array' });

      allData = [];
      headers = [];

      // قراءة أول ورقة
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

      if (rows.length === 0) {
        showStatus('❌ الملف فارغ!', 'error');
        return;
      }

      // استخراج الرؤوس
      headers = Object.keys(rows[0]);

      // تحويل البيانات
      allData = rows.map((row, index) => {
        return headers.map(header => row[header] || '');
      });

      displayTable(allData);
      showStatus(`✅ تم تحميل ${allData.length} سجل بنجاح!`, 'success');

      // تفعيل حقل البحث
      document.getElementById('search').disabled = false;
      document.getElementById('search').focus();

    } catch (error) {
      showStatus('❌ خطأ في قراءة الملف: ' + error.message, 'error');
      console.error(error);
    }
  };

  reader.readAsArrayBuffer(file);
});

// عرض الجدول
function displayTable(data) {
  const headerRow = document.getElementById('headerRow');
  const tableBody = document.getElementById('tableBody');

  // مسح البيانات السابقة
  headerRow.innerHTML = '';
  tableBody.innerHTML = '';

  if (data.length === 0) {
    tableBody.innerHTML = '<tr><td colspan="' + headers.length + '" class="no-data">لا توجد نتائج</td></tr>';
    document.getElementById('resultsCount').textContent = '';
    return;
  }

  // إضافة رؤوس الجدول
  headers.forEach(header => {
    const th = document.createElement('th');
    th.textContent = header;
    headerRow.appendChild(th);
  });

  // إضافة صفوف البيانات
  data.forEach(row => {
    const tr = document.createElement('tr');
    row.forEach(cell => {
      const td = document.createElement('td');
      td.textContent = cell;
      tr.appendChild(td);
    });
    tableBody.appendChild(tr);
  });

  // عرض عدد النتائج
  document.getElementById('resultsCount').textContent = `إجمالي النتائج: ${data.length}`;
}

// البحث
document.getElementById('search').addEventListener('input', function() {
  const keyword = this.value.toLowerCase().trim();

  if (keyword === '') {
    displayTable(allData);
    return;
  }

  const filtered = allData.filter(row =>
    row.some(cell => cell.toString().toLowerCase().includes(keyword))
  );

  displayTable(filtered);
});

// إظهار رسالة الحالة
function showStatus(message, type) {
  const statusDiv = document.getElementById('statusMessage');
  statusDiv.textContent = message;
  statusDiv.className = 'status-message ' + type;
  
  if (type !== 'error') {
    setTimeout(() => {
      statusDiv.className = 'status-message';
    }, 3000);
  }
}
</script>

</body>
</html>
